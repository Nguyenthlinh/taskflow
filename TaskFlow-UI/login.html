<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow – Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- NỬA TRÁI -->
    <div class="left-panel">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-check"></i></div>
            <span class="logo-text">TaskFlow</span>
        </div>

        <h1 class="hero-title">
            Quản lý công việc<br>
            <span>thông minh hơn</span>
        </h1>

        <p class="hero-subtitle">
            Theo dõi tiến độ, hoàn thành mục tiêu và tăng năng suất làm việc mỗi ngày.
        </p>

        <div class="floating-cards">
            <div class="mini-card">
                <!-- <div class="mini-card-dot" style="background:#10B981"></div> -->
                <span class="mini-card-text"><i class="fa-solid fa-circle-check" style="color:#10B981"></i> Hoàn thành Bài tập EF Core</span>
            </div>
            <div class="mini-card">
                        <!-- <div class="mini-card-dot" style="background:#F59E0B"></div> -->
                <span class="mini-card-text"><i class="fa-solid fa-clock" style="color:#F59E0B"></i> Đang làm JWT Authentication</span>
            </div>
            <div class="mini-card">
                <!-- <div class="mini-card-dot" style="background:#7C3AED"></div> -->
                <span class="mini-card-text"><i class="fa-solid fa-list-check" style="color:#7C3AED"></i> Thiết kế UI TaskFlow</span>
            </div>
        </div>
    </div>

    <!-- NỬA PHẢI -->
    <div class="right-panel">
        <div class="form-card">
            <div class="form-header">
                <h2>Đăng nhập </h2>
                <p>Chào mừng trở lại! Nhập thông tin để tiếp tục.</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <span class="icon"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="username" placeholder="Nhập username của bạn" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrapper">
                        <span class="icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Đăng nhập
                </button>
            </form>

            <p class="form-footer">
                Chưa có tài khoản?
                <a href="register.html">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
