<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow – Danh sách công việc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/tasks.css">
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="icon"><i class="fa-solid fa-check"></i></div>
            <span>TaskFlow</span>
        </div>

        <p class="nav-label">Menu</p>

        <a class="nav-item active" href="tasks.html">
            <span class="nav-icon"><i class="fa-solid fa-list-check"></i></span> My Tasks
        </a>
        <a class="nav-item" href="#">
            <span class="nav-icon"><i class="fa-solid fa-house"></i></span> Dashboard
        </a>
        <a class="nav-item" href="#">
            <span class="nav-icon"><i class="fa-solid fa-gear"></i></span> Settings
        </a>
   

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar" id="avatarLetter">U</div>
                <div>
                    <div class="user-name" id="username">User</div>
                    <div class="user-role">Member</div>
                </div>
                <button class="btn-logout" onclick="logout()" title="Đăng xuất">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">

        <!-- Header -->
        <div class="page-header">
            <div class="greeting">
                <h1>Xin chào 👋</h1>
                <p id="subGreeting">Đang tải...</p>
            </div>
            <button class="btn-add" onclick="openCreateModal()">
                <i class="fa-solid fa-plus"></i> Thêm task mới
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label"><i class="fa-solid fa-layer-group"></i> Tổng cộng</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fa-solid fa-spinner"></i> Đang làm</div>
                <div class="stat-value" id="statPending">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fa-solid fa-circle-check"></i> Hoàn thành</div>
                <div class="stat-value" id="statCompleted">0</div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all"
                onclick="renderTasks('all')">Tất cả</button>
            <button class="tab-btn" data-filter="pending"
                onclick="renderTasks('pending')">⏳ Đang làm</button>
            <button class="tab-btn" data-filter="completed"
                onclick="renderTasks('completed')">✅ Hoàn thành</button>
        </div>

        <!-- Task List -->
        <div class="task-list" id="taskList">
            <!-- Render bằng JavaScript -->
        </div>

    </main>

    <!-- ===== MODAL TẠO / SỬA TASK ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">✨ Thêm task mới</h3>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="form-group">
                <label>Tiêu đề *</label>
                <input type="text" id="taskTitle" placeholder="Nhập tiêu đề task...">
            </div>

            <div class="form-group">
                <label>Mô tả</label>
                <textarea id="taskDesc" rows="3" placeholder="Mô tả chi tiết (không bắt buộc)..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Hủy</button>
                <button class="btn-save" id="btnSave" onclick="saveTask()">Lưu task</button>
            </div>
        </div>
    </div>

    <script src="js/tasks.js"></script>
</body>
</html>
